name: Reproducibility CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  reproduce-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run full reproducible ethno-toxicology pipeline
        run: python src/run_full_pipeline.py --seed 42

      - name: Run Round-2 audit-proof verification suite
        run: pytest -v tests/test_pipeline.py
